<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <title>🏆 The Dumbest Game in the World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233cff7a'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>
  <div id="bgOverlay"></div>

  <div id="game">
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <div id="topbar">
      <div class="topbar-left">
        <span class="led" id="statusLed"></span>
        <span id="attemptLabel">attempt #1</span>
      </div>
      <div class="topbar-right">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <button id="soundToggle" class="icon-btn" aria-label="Toggle sound">🔊</button>
        <span id="timeLabel">0:00</span>
      </div>
    </div>

    <div class="panel-content">
      <div id="instruction">Click the green button to begin.</div>

      <div id="stage">
        <div id="socketInner">
          <svg id="countdownRing" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="ring-bg" cx="120" cy="120" r="110"/>
            <circle class="ring-fill" cx="120" cy="120" r="110"/>
          </svg>
          <div class="btn-warning-ring"></div>
          <button id="greenBtn">
            <span class="btn-face">PRESS</span>
          </button>
        </div>
      </div>

      <div id="countdown"></div>
      <div id="feedback"></div>

      <div id="letterLayer" aria-hidden="true"></div>
    </div>

    <div id="progress">
      <div id="progressFill"></div>
    </div>

    <div id="denyOverlay" aria-hidden="true"></div>
    <div id="denyX" aria-hidden="true">✕</div>
  </div>

  <script src="background.js"></script>
  <script src="script.js"></script>
</body>
</html>
