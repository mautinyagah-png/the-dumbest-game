<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🟢 The Green Button Has Notes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%233cff7a'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div id="topbar">
      <span id="attemptLabel">attempt #1</span>
      <span id="timeLabel">0:00</span>
    </div>

    <div id="instruction">Click the green button to begin.</div>

    <div id="stage">
      <div id="letter"></div>
      <button id="greenBtn">START</button>
    </div>

    <div id="countdown"></div>
    <div id="feedback"></div>

    <div id="progress">
      <div id="progressFill"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
